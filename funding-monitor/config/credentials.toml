# Host-neutral declaration of the secrets this skill can use.
# Any agent host (Claude Code, Codex, OpenClaw, Hermes, Muse, cron, ...) should read this file,
# store each secret with its own secret mechanism, and make it reachable by the process that
# runs scripts/scan.py, as one of the delivery forms listed under [delivery].
# `python3 scripts/scan.py credentials` reports which secrets resolve and how, never their values.

[delivery]
# scan.py tries these in order for each credential named NAME. The first non-empty value wins.
order = [
  "environment variable NAME",
  "file path in environment variable NAME_FILE (Docker/Compose secrets convention)",
  "file $CREDENTIALS_DIRECTORY/NAME (systemd LoadCredential convention)",
  "file /run/secrets/name, lowercase (Docker and Kubernetes mounted-secret convention)",
  "line NAME=value in ~/.config/funding-monitor/.env (fallback for hosts with no secret store)",
]

[[credential]]
name = "SAM_API_KEY"
secret = true
required = false
purpose = "SAM.gov Get Opportunities API: DoD and DARPA broad agency announcements, RFIs, special notices"
used_by_channels = ["sam-gov"]
sent_to_hosts = ["api.sam.gov"]
sent_as = "api_key query parameter"
obtain = "references/api-keys.md, section SAM.gov"
rotation = "Regenerate on sam.gov Account Details if exposed. Free, read-only, quota-limited."
without_it = "The sam-gov channel is skipped and logged. Other channels run."

[[credential]]
name = "SIMPLER_API_KEY"
secret = true
required = false
purpose = "Simpler.Grants.gov search API (same data as the keyless Grants.gov API)"
used_by_channels = ["simpler"]
sent_to_hosts = ["api.simpler.grants.gov"]
sent_as = "X-API-Key request header"
obtain = "references/api-keys.md, section Simpler.Grants.gov"
rotation = "Keys unused for 30 days are disabled. Create a new one at simpler.grants.gov/developer."
without_it = "The simpler channel is skipped and logged. Grants.gov still covers the same data."
