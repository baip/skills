# funding-monitor profile TEMPLATE
# The setup conversation (SKILL.md, Setup mode) fills this in. You can also edit it by hand.
# Keep your filled-in copy at ~/.config/funding-monitor/profile.toml, or bundle it into a
# personal copy of the skill as config/profile.toml.
# API keys never go in this file. Put them in environment variables or ~/.config/funding-monitor/.env

[meta]
is_template = true                 # setup sets this to false
owner = ""                         # e.g. "Jane Doe lab, Dept. of Chemistry"
institution = ""                   # e.g. "University of X"
applicant_type = ""                # e.g. "public institution of higher education"
career_stage = ""                  # e.g. "assistant professor" (affects CAREER, YIP, early-career calls)
country = "US"
contact = ""                       # optional, used only in the HTTP User-Agent if you add it

[email_sweep]
# Optional: Gmail or Outlook labels/folders where the user files funding mail, searched each sweep.
labels = []

[schedule]
scan_every = "weekly"              # how often you intend to run a scan (cron, scheduled task, or by hand)
window_days = 8                    # look-back window per scan; slightly longer than the cadence
email_sweep = "each scan, through an email connector if one is available"

[fetching]
# scan.py honors robots.txt by default. Set false to ignore it for every channel, or set
# ignore_robots = true on individual channels. This is the user's decision, never Claude's.
# Overrides are logged in each digest. Check the site's terms of use before overriding.
respect_robots = true

# Separate Grants.gov / Simpler queries. One term per query works better than OR strings.
[queries]
api = []

# Scoring. Case-insensitive substring match. Title hits count double.
# tier_a: core expertise. tier_b: adjacent or collaborator-led. tier_c: programs and mechanisms.
[keywords]
tier_a = []
tier_b = []
tier_c = []
weights = { tier_a = 3, tier_b = 2, tier_c = 1 }

[agencies]
boost = []                         # Grants.gov agency code prefixes, e.g. ["NSF", "PAMS", "DOE", "DOD"]
boost_points = 1
neutral = []                       # no boost, no penalty, e.g. ["HHS-NIH", "NASA"]
other_penalty = 3                  # applied to Grants.gov items from agencies in neither list

[exclude]
title_terms = ["sbir", "sttr", "small business innovation", "k-12"]
# Grants.gov applicant type codes you can apply under. 06 public higher ed, 20 private higher ed,
# 12 nonprofit 501(c)(3), 25 "others, see text", 99 unrestricted. Leave empty to skip this check.
eligible_codes = ["06", "20", "25", "99"]
penalty = 5

[thresholds]
strong_min_score = 6
strong_min_distinct_terms = 2
possible_min_score = 3

# ---------------------------------------------------------------------------------------------
# Channels. means: api | rss | sitemap | web | browser | email | alert | manual
#   api, rss, sitemap, web, browser -> fetched by scan.py
#     (handler = grants_gov | simpler | sam | rss | sitemap | web | browser)
#   browser needs the optional Playwright package. Without it the channel becomes a manual reminder.
#   email, alert   -> read by Claude during the email sweep (list the sender addresses)
#   manual         -> no automation possible; listed in the plan as a reminder
# signup: optional link where the user subscribes (email channels). See references/email-lists.md.
# frequency: "each scan" | "daily" | "weekly" | "biweekly" | "monthly" (with --state, a channel is
#   skipped until it is due). For email and alert channels it describes delivery.
# ---------------------------------------------------------------------------------------------

[[channel]]
id = "grants-gov"
name = "Grants.gov"
covers = "Federal grants and cooperative agreements (NSF, DOE, DoD assistance, NIH, NASA, and others)"
means = "api"
handler = "grants_gov"
frequency = "each scan"
enabled = true

[[channel]]
id = "nsf-announcements"
name = "NSF program announcements feed"
covers = "New NSF solicitations and program descriptions"
means = "rss"
handler = "rss"
url = "https://www.nsf.gov/rss/rss_www_funding_pgm_annc_inf.xml"
agency = "U.S. National Science Foundation"
agency_code = "NSF"
frequency = "each scan"
enabled = true

[[channel]]
id = "nsf-upcoming"
name = "NSF upcoming due dates feed"
covers = "NSF deadlines in the next 30 days"
means = "rss"
handler = "rss"
url = "https://www.nsf.gov/rss/rss_www_funding_upcoming.xml"
agency = "U.S. National Science Foundation"
agency_code = "NSF"
doc_type = "upcoming due date"
frequency = "each scan"
enabled = true

[[channel]]
id = "nih-guide-rss"
name = "NIH Guide funding opportunities feed"
covers = "NIH funding opportunities and notices"
means = "rss"
handler = "rss"
url = "https://grants.nih.gov/grants/guide/newsfeed/fundingopps.xml"
agency = "National Institutes of Health"
agency_code = "HHS-NIH"
frequency = "each scan"
enabled = false
tags = ["biomedical"]

[[channel]]
id = "simpler"
name = "Simpler.Grants.gov API"
covers = "Same data as Grants.gov, with post-date filtering"
means = "api"
handler = "simpler"
key_env = "SIMPLER_API_KEY"
frequency = "each scan"
enabled = false
setup = "references/api-keys.md#simplergrantsgov"

[[channel]]
id = "sam-gov"
name = "SAM.gov contract opportunities API"
covers = "DoD and DARPA broad agency announcements, RFIs, special notices"
means = "api"
handler = "sam"
key_env = "SAM_API_KEY"
organizations = []                 # e.g. ["DEFENSE ADVANCED RESEARCH PROJECTS AGENCY", "OFFICE OF NAVAL RESEARCH"]
ptypes = ["o", "k", "p", "r", "s"]
max_requests_per_run = 4           # personal keys have a small daily quota
frequency = "each scan"
enabled = false
tags = ["defense"]
setup = "references/api-keys.md#samgov"

[[channel]]
id = "alert-simpler-saved-search"
name = "Simpler.Grants.gov saved-search alerts"
covers = "Posted and forecasted federal grants matching your saved searches"
means = "alert"
senders = []                       # fill in after the first alert arrives
frequency = "provider digest"
enabled = false
setup = "references/api-keys.md#saved-search-alerts"

[[channel]]
id = "alert-sam-saved-search"
name = "SAM.gov saved-search alerts"
